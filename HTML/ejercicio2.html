<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Metainformación obligatoria -->
    <meta name="description" content="Descripción de la página">
    <meta name="author" content="Tu Nombre">
    <title>Ejercicio HTML</title>
</head>
<body>

    <!-- Título principal -->
    <h1>Mi Página Multimedia</h1>

    <!-- Enlaces internos (marcadores) -->
    <p>Navegación rápida:</p>
    <a href="#mi-imagen">Ir a la Imagen</a> | 
    <a href="#mi-video">Ir al Video</a>

    <br><br><br>

    <!-- Marcador de la imagen -->
    <div id="mi-imagen">
        <h2>Imagen</h2>
        <!-- Etiqueta img con src, alt, width y height -->
        <img src="https://i.blogs.es/cf55cd/1366_2000/840_560.jpeg" alt="Un paisaje de naturaleza" width="600" height="400">
    </div>

    <br><br><br>

    <!-- Marcador del video -->
    <div id="mi-video">
        <h2>Video de YouTube</h2>
        <!-- Código iframe de YouTube obtenido en Compartir -> Insertar -->
        <iframe width="560" height="315" src="https://youtu.be/0oUodTqfz0Q" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>

</body>
</html>
